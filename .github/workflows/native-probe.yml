name: Native display probe

# A feasibility experiment for the planned Native Apps feature. It is separate from the app build
# and never blocks a release. A red result for one Android version is a finding, not a broken build.
on:
  push:
    paths: ['ci/native-probe/**', '.github/workflows/native-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: bash ci/native-probe/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash ci/native-probe/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'probe-api-${{ matrix.api }}', path: ci/native-probe/out/result.txt }
