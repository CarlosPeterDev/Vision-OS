name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Unit tests
        run: gradle :audio-engine:test :ai-assistant:test :xr-engine:test --stacktrace
      - name: Lint
        run: gradle :app:lintDebug --stacktrace
      # With the two signing secrets set, a release APK and AAB are built with that fixed key.
      # Without them, a debug APK is built, which is signed with a new key every time.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nexus.jks"
            echo "NEXUS_KEYSTORE_FILE=$RUNNER_TEMP/nexus.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "${NEXUS_KEYSTORE_FILE:-}" ]; then
            gradle :app:assembleRelease :app:bundleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - name: Verify and checksum
        run: |
          mkdir dist
          if [ -n "${NEXUS_KEYSTORE_FILE:-}" ]; then
            apk="dist/NexusVisionOS-0.1.${GITHUB_RUN_NUMBER}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/NexusVisionOS-0.1.${GITHUB_RUN_NUMBER}.aab"
            echo "Signed with the fixed key. It installs over an earlier build made with the same key." > dist/SIGNING.txt
          else
            apk="dist/NexusVisionOS-0.1.${GITHUB_RUN_NUMBER}-dev.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$apk"
            echo "Debug-signed with a one-time key. Uninstall the earlier build first; this deletes app data." > dist/SIGNING.txt
          fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$apk"
          (cd dist && find . -maxdepth 1 \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} + > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/nexus.jks"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back virtualscene
          script: bash ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: smoke/ }
      - name: Publish failed-run evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "smoke-failed-${GITHUB_RUN_NUMBER}" smoke/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Failed emulator run ${GITHUB_RUN_NUMBER}" --notes "Diagnostics only. No app build here."

  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: smoke, path: smoke }
      # Emulator screenshots and the app's own log lines; the full system log stays in the run artifact.
      - run: cp smoke/*.png smoke/summary.txt dist/
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${GITHUB_RUN_NUMBER}-dev" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Nexus Vision OS 0.1.${GITHUB_RUN_NUMBER} (development build)" \
            --notes "Development build. $(cat dist/SIGNING.txt) Not yet validated on a physical device."
